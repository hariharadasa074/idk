    <text x="4" y="22" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold">LEFT</text>
  </g>
  <text x="1810" y="180" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">WCS</text>

