  <text x="40" y="23" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Autodesk AutoCAD 2027 - EDUCATION (NON COMMERCIAL)  Drawing111.dwg</text>
  <text x="1650" y="23" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">hariharadasa074</text>

