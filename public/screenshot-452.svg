<svg width="1200" height="850" viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle Paper Shadow -->
    <filter id="certDropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Solid Crisp White Certificate Background -->
  <rect width="1200" height="850" fill="#ffffff" filter="url(#certDropShadow)"/>

  <!-- Left Edge Subtle Accent Line -->
  <rect x="0" y="0" width="18" height="850" fill="#3b69a8"/>

  <!-- Top Right Blue Forage Ribbon / Banner (Matches Screenshot (452).png) -->
  <g transform="translate(850, 0)">
    <!-- Hanging Ribbon Shape with Lower Point -->
    <path
      d="M 0 0 L 260 0 L 260 215 L 130 245 L 0 215 Z"
      fill="#3b69a8"
    />

    <!-- Forage Origami Diamond/Gem Logo -->
    <g transform="translate(40, 48)">
      <!-- Top facet -->
      <polygon points="24,0 48,14 24,28 0,14" fill="#ffffff"/>
      <!-- Left lower facet -->
      <polygon points="0,18 24,32 24,54 0,40" fill="#dbeafe" opacity="0.95"/>
      <!-- Right lower facet -->
      <polygon points="48,18 24,32 24,54 48,40" fill="#bfdbfe" opacity="0.8"/>
    </g>

    <!-- "Forage" Brand Text -->
    <text x="105" y="88" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
      Forage
    </text>

    <!-- Tagline -->
    <text x="25" y="145" fill="#f1f5f9" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="400">
      Inspiring and empowering
    </text>
    <text x="50" y="168" fill="#f1f5f9" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="400">
      future professionals
    </text>
  </g>

  <!-- Top Left Official TATA Logo -->
  <g transform="translate(75, 75)">
    <!-- Official Tata Emblem -->
    <g transform="scale(0.85)">
      <!-- Outer Oval -->
      <ellipse cx="50" cy="40" rx="46" ry="34" fill="none" stroke="#00509E" stroke-width="7"/>
      <!-- Center Stem -->
      <path d="M 50 16 L 50 64" stroke="#00509E" stroke-width="7" stroke-linecap="round"/>
      <!-- Left Curved Fork -->
      <path d="M 18 25 C 24 45, 42 60, 50 64" fill="none" stroke="#00509E" stroke-width="7" stroke-linecap="round"/>
      <!-- Right Curved Fork -->
      <path d="M 82 25 C 76 45, 58 60, 50 64" fill="none" stroke="#00509E" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- TATA Bold Lettering -->
    <text x="-4" y="90" fill="#00509E" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="4">
      TATA
    </text>
  </g>

  <!-- Recipient Name: Suman Das -->
  <text x="75" y="370" fill="#1e242d" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Suman Das
  </text>

  <!-- Program Title -->
  <text x="75" y="425" fill="#2d3748" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Data Visualisation: Empowering Business
  </text>
  <text x="75" y="475" fill="#2d3748" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    with Effective Insights
  </text>

  <!-- Certificate of Completion -->
  <text x="75" y="540" fill="#2d3748" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="26" font-weight="400">
    Certificate of Completion
  </text>

  <!-- Issue Date -->
  <text x="75" y="580" fill="#2d3748" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="500">
    March 19th, 2026
  </text>

  <!-- Thin Divider Line -->
  <line x1="75" y1="610" x2="1115" y2="610" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Task Description Section -->
  <text x="75" y="640" fill="#4a5568" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="500">
    Over the period of March 2026, Suman Das has completed practical tasks in:
  </text>

  <!-- 4 Competency Tasks -->
  <g transform="translate(75, 665)" fill="#2d3748" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="600">
    <text x="0" y="0">Framing the Business Scenario</text>
    <text x="0" y="20">Choosing the Right Visuals</text>
    <text x="0" y="40">Creating Effective Visuals</text>
    <text x="0" y="60">Communicating Insights and Analysis</text>
  </g>

  <!-- Bottom Right Signature Block (Matches Tom Brunskill Signature in Screenshot (452).png) -->
  <g transform="translate(940, 630)">
    <!-- Exact Handwritten Signature -->
    <path
      d="
        M 10 75 
        C 14 55, 18 35, 24 38 
        C 30 42, 28 65, 34 72 
        C 40 80, 52 45, 58 48 
        C 64 52, 60 70, 68 70 
        C 74 70, 78 50, 85 45 
        C 92 40, 98 60, 104 68 
        C 110 75, 115 50, 120 40 
        C 125 30, 130 55, 134 68
        M 22 45 C 10 50, 8 70, 20 75 C 32 80, 36 60, 26 48
        M 72 40 Q 85 10 98 42
      "
      stroke="#718096"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <text x="0" y="105" fill="#1a202c" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="700">
      Tom Brunskill
    </text>
    <text x="0" y="124" fill="#718096" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="400">
      Co-Founder of Forage
    </text>
  </g>

  <!-- Bottom Verification Line -->
  <text x="75" y="825" fill="#a0aec0" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="400">
    Enrolment Verification Code gC24iPBEyuK6Tp96F  |  User Verification Code 69a828372d955c8bb6fd007d  |  Issued by <tspan font-weight="600" fill="#718096">Forage</tspan>
  </text>
</svg>
